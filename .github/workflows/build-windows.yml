# Automatic build of the Windows installer (Desktop/Geogame92_Setup.exe) on a Windows runner.
# - Run manually (Actions tab -> "Build Windows installer" -> Run workflow):
#   the installer is attached to the run as a downloadable artifact.
# - Push a tag like v1.1: the installer is also published as a GitHub release.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        id: version
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.${{ github.run_number }}-test" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build Geogame92.exe
        run: pyinstaller --noconfirm Geogame92.spec

      - name: Smoke test (game starts and keeps running)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $log = Join-Path $env:APPDATA "GeoGame\geogame_error.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\Geogame92.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            throw "Geogame92.exe exited early (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $log) { Get-Content $log; throw "Geogame92.exe logged an error" }
          "Geogame92.exe ran for 20 s without errors"

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" Geogame92.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Geogame92_Setup
          path: Desktop/installer_build/Geogame92_Setup.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GeoGame ${{ steps.version.outputs.value }} (Windows)
          files: Desktop/installer_build/Geogame92_Setup.exe
          body: |
            Windows installer for GeoGame (desktop version, Geogame92).
            Download **Geogame92_Setup.exe** and run it. Installing over 1.0 upgrades it in place.

            Play in the browser instead: https://kkoutrid.github.io/geogame-web/
